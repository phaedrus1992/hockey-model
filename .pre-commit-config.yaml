repos:
  - repo: https://github.com/editorconfig-checker/editorconfig-checker
    rev: 0adfdb012938ada0cf563a40f2fceaf9466290ca # frozen: v4.0.2
    hooks:
      - id: editorconfig-checker

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check .
        language: system
        pass_filenames: false
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
        types: [python]
      - id: ty
        name: ty check
        entry: uv run ty check
        language: system
        pass_filenames: false
        types: [python]
      - id: pytest
        name: pytest with coverage
        entry: uv run pytest
        language: system
        pass_filenames: false
        stages: [pre-push]
        types: [python]
      - id: per-module-coverage
        name: per-module coverage floor
        entry: uv run python3 scripts/check_per_module_coverage.py
        language: system
        pass_filenames: false
        stages: [pre-push]
        types: [python]
