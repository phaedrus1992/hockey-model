name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check

  test:
    runs-on: ubuntu-latest
    needs: validation
    steps:
      # The registry checker reads the git history of each record.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: rm -f coverage.json
      - run: uv run pytest
      - run: uv run python3 scripts/check_per_module_coverage.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          if-no-files-found: error
          path: |
            lcov.info
            coverage.json

  editorconfig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install editorconfig-checker
        run: |
          EC_VERSION=v4.0.2
          EC_SHA256=44efaef3ed14c6ab52eb87481d78e5e5c204796dccf26e2f4598a61ba17f8003
          # RUNNER_TEMP belongs to this job, so no other process can swap the archive
          # between the digest check and the extract.
          archive="$RUNNER_TEMP/ec.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/editorconfig-checker/editorconfig-checker/releases/download/${EC_VERSION}/editorconfig-checker-linux-amd64.tar.gz"
          echo "${EC_SHA256}  $archive" | sha256sum -c -
          tar -xzf "$archive" -C /usr/local/bin editorconfig-checker
      - run: editorconfig-checker

  # Mutation testing is advisory. A surviving mutant shows a test with a weak oracle,
  # but it does not fail the build.
  mutation:
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run mutmut run
      - run: uv run mutmut export-cicd-stats
      - run: uv run mutmut results > mutation-results.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation
          if-no-files-found: error
          path: |
            mutation-results.txt
            mutants/mutmut-cicd-stats.json
