name: mutation

# The full mutation run is slow and advisory, so it runs weekly and on demand.
# Ordinary pull requests do not run it. Local pre-push checks cover changed code (#76).
on:
  schedule:
    # Mondays at 07:00 UTC.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# One run at a time for each ref. A queued run waits, so two runs never write the report.
concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The registry checker reads the git history of each record.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - name: Run mutation shard
        timeout-minutes: 40
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mapfile -t patterns < <(uv run python3 scripts/mutation_shards.py patterns --shard "$SHARD")
          uv run mutmut run "${patterns[@]}"
      - name: Note an unfinished shard
        if: failure() || cancelled()
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          echo "Shard $SHARD did not finish. Its results are partial." >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-shard-${{ matrix.shard }}
          if-no-files-found: warn
          path: mutants/

  merge:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-shard-*
          path: .tmp/shards
      - name: Merge shard results
        run: uv run python3 scripts/mutation_shards.py merge --from .tmp/shards --into mutants
      - name: Export results
        # A failed export leaves no stats file. The report job then reports the failure.
        continue-on-error: true
        run: |
          uv run mutmut export-cicd-stats
          uv run mutmut results >mutation-results.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation
          if-no-files-found: warn
          path: |
            mutation-results.txt
            mutants/mutmut-cicd-stats.json

  report:
    needs: [shard, merge]
    # Only the default branch may write issues. A manual run on another branch skips this job.
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SHARD_RESULT: ${{ needs.shard.result }}
      MERGE_RESULT: ${{ needs.merge.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        # A missing artifact leaves no stats file, so the report step counts it as a failure.
        continue-on-error: true
        with:
          name: mutation
          path: .tmp/mutation
      - name: File or update the report
        run: |
          execution=failure
          if [[ "$SHARD_RESULT" == success && "$MERGE_RESULT" == success ]]; then
            execution=success
          fi
          scripts/report-mutation.sh \
            --stats .tmp/mutation/mutants/mutmut-cicd-stats.json \
            --execution "$execution" \
            --run-url "$RUN_URL"
          # The report is filed. A failed execution still fails the job.
          test "$execution" = success
