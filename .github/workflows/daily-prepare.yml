# Prepares the game day before the report triggers: a full refresh, the backtest, and the fit on its live features.
#
# The daily-report workflow then refreshes only the starters before it predicts. The
# prepare run MUST finish before the next hour in TRIGGER_HOURS_UTC in report_trigger.py.
# It starts after the last late game of the night ends, so its refresh has every result.
name: daily-prepare

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

# The same group as daily-report, so only one run writes the cached store at a time.
concurrency:
  group: hockey-model-store
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/hockey-model
          key: hockey-model-store-${{ github.run_id }}
          restore-keys: |
            hockey-model-store-
      - env:
          HOCKEY_MODEL_DB: ${{ runner.temp }}/hockey-model/store.db
        run: bash scripts/daily-prepare.sh
      # Saved even after a failure or an early stop (exit code 75), so a partial backfill resumes
      # on the next run.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: ${{ runner.temp }}/hockey-model
          key: hockey-model-store-${{ github.run_id }}
